name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Code Imports & Integrity
      run: |
        python -c "import app, database, resume_parser, matcher, charts, utils; print('Core modules verified')"

    - name: Test Database & Seed Logic
      run: |
        python -c "import database, utils; database.init_db(); utils.seed_sample_data(database); print('Database verified')"
